[project]
name = "daleelai-backend"
version = "0.1.0"
description = "DaleelAI v2 API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "litellm>=1.60",
    "httpx>=0.28.1",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "langgraph>=0.2.60",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
pipeline = [
    "datasketch>=2.0.0",
    "fastembed>=0.9.0",
    "pymupdf4llm>=1.28.2",
    "qdrant-client>=1.19.1",
]

[tool.uv]
package = false
default-groups = ["dev", "pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
