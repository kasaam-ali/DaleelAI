# Production stack (no source bind mounts, no hot reload). Local dev stays in docker-compose.yml.
# Secrets (DB credentials, API keys) live in .env / Railway variables — never in this file.
services:
  backend:
    build:
      context: ./backend
      target: prod
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      FASTEMBED_CACHE_PATH: /cache/fastembed
    volumes:
      - model_cache:/cache/fastembed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on: [backend]
    restart: unless-stopped

  postgres:
    image: postgres:16
    # DB credentials come from .env via env_file only (no credential keys in this YAML).
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daleel}
      POSTGRES_DB: ${POSTGRES_DB:-daleel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  qdrant_snapshots:
  model_cache:
