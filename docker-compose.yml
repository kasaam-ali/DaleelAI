services:
  backend:
    build:
      context: ./backend
      target: dev
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://daleel:daleel@postgres:5432/daleel
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: daleel
      POSTGRES_PASSWORD: daleel
      POSTGRES_DB: daleel
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daleel -d daleel"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
  frontend_node_modules:
